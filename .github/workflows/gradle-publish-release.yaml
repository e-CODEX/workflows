name: "Publish Release to Maven Repository"
# Deploys a Gradle release to the e-CODEX JFrog Artifactory (scm.ecodex.eu) with the JFrog CLI.
#
# What is done and why:
#   - Authentication: GitHub OIDC token exchanged by the JFrog CLI for a short-lived JFrog token (no secrets).
#   - Deployment: 'jf gradle artifactoryPublish' deploys every Gradle publication (jars, POMs, distribution zip)
#     and records them, with all resolved dependencies, in the JFrog build-info '<repository>'. The build-info is
#     what Artifactory (and Xray) use to know where an artifact comes from and what it contains.
#   - SBOM: the CycloneDX 'cyclonedxBom' task produces the aggregated SBOM of the project; it is deployed next to
#     the distribution zip as '<zip name>-cyclonedx.json' so consumers find it beside the artifact they download.
#   - Attestations: the distribution zip (the artifact users actually install) gets a SLSA build-provenance
#     attestation and an SBOM attestation, signed with Sigstore and stored in GitHub. Their subject is the zip's
#     path in Artifactory, so the setup-jfrog-cli post step can attach them to the zip as JFrog evidence.
#   - End of job (setup-jfrog-cli post step): adds the git details, publishes the build-info and creates the
#     JFrog evidence from the attestations.
on:
    workflow_call:
        inputs:
            java-version:
                description: "Java version to use for the build."
                required: true
                type: number
                default: 21
            gradle-parameters:
                description: "Extra parameters to pass to Gradle"
                required: false
                type: string
                default: ""
            maven-repo-id:
                description: "Deprecated and ignored: the JFrog CLI deploys to 'deploy-repo'"
                required: false
                type: string
                default: ""
            deploy-repo:
                description: "Artifactory repository to deploy the release to"
                required: false
                type: string
                default: "libs-release"
            distribution-path:
                description: "Local path (glob) of the main artifact (distribution zip) to attest"
                required: true
                type: string
            sbom-path:
                description: "Path of the CycloneDX JSON SBOM generated by the 'cyclonedxBom' task"
                required: false
                type: string
                default: "build/reports/cyclonedx/bom.json"
            tag:
                description: 'The tag to checkout (optional)'
                required: false
                type: string
            environment:
                description: "Deployment environment"
                required: false
                type: string
                default: "production"
permissions:
    contents: read
jobs:
    publish:
        name: Publish Release to Maven Repository
        permissions:
            contents: write     # dependency submission to GitHub
            id-token: write     # GitHub OIDC token, used for the JFrog login and for signing the attestations
            attestations: write # store the attestations in GitHub
        runs-on: ubuntu-latest
        # The environment holds the protection rules (approvals) and is part of the OIDC claims JFrog can check
        environment: ${{ inputs.environment }}
        env:
            # Build-info name in Artifactory (the default would be the caller's workflow name, shared between repos)
            JFROG_CLI_BUILD_NAME: ${{ github.event.repository.name }}
        steps:
            # Releases build the git tag created by the tag-release workflow
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    ref: ${{ inputs.tag }}

            # Needed by the documentation module (diagrams)
            -   name: Install Graphviz
                uses: e-CODEX/workflows/.github/actions/install-graphviz@main

            -   name: Setup Java
                uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
                with:
                    distribution: 'temurin'
                    java-version: ${{ inputs.java-version }}

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

            # Installs a pinned JFrog CLI and logs in with GitHub OIDC (OIDC integration 'setup-jfrog' in JFrog).
            # Its post step publishes the build-info and creates the JFrog evidence at the end of the job.
            -   name: Setup JFrog CLI
                uses: jfrog/setup-jfrog-cli@4c2f06da03095113100534a16d58d8a252680949 # v5.3.5
                env:
                    JF_URL: https://scm.ecodex.eu
                with:
                    version: 2.133.0
                    oidc-provider-name: setup-jfrog

            # Dependency graph for Dependabot alerts / GitHub Advanced Security
            -   name: Submit Dependency Release to GitHub Advanced Security
                uses: mikepenz/gradle-dependency-submission@v1

            # gradle-config: deploy to 'deploy-repo' with the Gradle wrapper; POMs are deployed, Ivy descriptors
            # are not (Maven repository). Dependencies keep being resolved from the repositories of the build.
            # The JFrog Gradle extractor is injected with an init script, which does not support the
            # configuration cache, hence --no-configuration-cache.
            -   name: Publish Release
                env:
                    DEPLOY_REPO: ${{ inputs.deploy-repo }}
                    GRADLE_PARAMETERS: ${{ inputs.gradle-parameters }}
                run: |
                    jf gradle-config --repo-deploy="${DEPLOY_REPO}" --use-wrapper --deploy-ivy-desc=false
                    jf gradle clean cyclonedxBom artifactoryPublish --no-configuration-cache ${GRADLE_PARAMETERS}

            # The attestation subject must be the zip's real path in Artifactory (a virtual 'deploy-repo' stores
            # it in one of its local repositories), so the deployed zip is looked up by its sha256 (AQL).
            # The SBOM is uploaded next to it; 'jf rt upload' also adds it to the build-info.
            -   name: Deploy the SBOM next to the distribution
                id: distribution
                env:
                    DISTRIBUTION: ${{ inputs.distribution-path }}
                    SBOM_PATH: ${{ inputs.sbom-path }}
                run: |
                    zip=$(ls ${DISTRIBUTION})
                    sha=$(sha256sum "${zip}" | cut -d' ' -f1)
                    target=$(jf rt curl -s -XPOST /api/search/aql -H "Content-Type: text/plain" \
                      -d "items.find({\"sha256\":\"${sha}\"}).include(\"repo\",\"path\",\"name\")" \
                      | jq -r '.results[0] // error("distribution not found in Artifactory") | "\(.repo)/\(.path)/\(.name)"')
                    jf rt upload "${SBOM_PATH}" "${target%.zip}-cyclonedx.json" --flat
                    echo "subject-name=${target}" >> "${GITHUB_OUTPUT}"
                    echo "subject-digest=sha256:${sha}" >> "${GITHUB_OUTPUT}"

            # SLSA build provenance: which workflow, commit and runner produced the zip
            -   name: Attest the distribution provenance
                uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
                with:
                    subject-name: ${{ steps.distribution.outputs.subject-name }}
                    subject-digest: ${{ steps.distribution.outputs.subject-digest }}

            # Signed statement that the SBOM describes this zip
            -   name: Attest the distribution SBOM
                uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
                with:
                    subject-name: ${{ steps.distribution.outputs.subject-name }}
                    subject-digest: ${{ steps.distribution.outputs.subject-digest }}
                    sbom-path: ${{ inputs.sbom-path }}
