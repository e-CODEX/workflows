name: "Publish AsciiDoc PDF Release"
on:
    workflow_call:
        inputs:
            adoc-files:
                description: "AsciiDoc files to render as PDF, one path per line, relative to the repository root."
                required: true
                type: string
            tag:
                description: "The tag to checkout. Also used as the document version (project-version attribute) and in the PDF file names."
                required: true
                type: string
            asciidoctor-image:
                description: "Docker image providing asciidoctor-pdf. Pin a tested tag or digest."
                required: false
                type: string
                default: "asciidoctor/docker-asciidoctor:latest"
            failure-level:
                description: "Minimum Asciidoctor log level that fails the build (INFO, WARN, ERROR, FATAL)."
                required: false
                type: string
                default: "ERROR"
            artifact-name:
                description: "Name of the workflow artifact that will hold all generated PDFs (downloaded by later jobs)."
                required: false
                type: string
                default: "documentation-pdf"
        outputs:
            artifact-name:
                description: "Name of the artifact containing the generated PDFs."
                value: ${{ inputs.artifact-name }}

permissions:
    contents: read
jobs:
    pdf:
        name: Generate the PDFs
        runs-on: ubuntu-latest
        steps:
            -   name: Validate release tag input
                id: validate
                env:
                    TAG: ${{ inputs.tag }}
                run: |
                    if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z]+)*$ ]]; then
                      echo "Invalid tag format: '$TAG'. Expected a release tag like v1.2.3" >&2
                      exit 1
                    fi
                    echo "safe-tag=$TAG" >> "$GITHUB_OUTPUT"
            -   name: Checkout tag
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    ref: ${{ steps.validate.outputs.safe-tag }}
            -   name: Build PDFs
                  # Each file is rendered as <file-name>-<tag>.pdf in ./out.
                # The tag is passed as the `project-version` attribute (shown on the title page).
                env:
                    ADOC_FILES: ${{ inputs.adoc-files }}
                    TAG: ${{ steps.validate.outputs.safe-tag }}
                    IMAGE: ${{ inputs.asciidoctor-image }}
                    FAILURE_LEVEL: ${{ inputs.failure-level }}
                run: |
                    while IFS= read -r file; do
                      [ -z "$file" ] && continue
                      base="$(basename "$file" .adoc)"
                      docker run --rm -v "$PWD":/documents "$IMAGE" \
                        asciidoctor-pdf \
                        --failure-level="$FAILURE_LEVEL" \
                        -a project-version="$TAG" \
                        -D out \
                        -o "${base}-${TAG}.pdf" \
                        "$file"
                    done <<< "$ADOC_FILES"
                    ls -l out
            -   name: Upload PDFs as workflow artifact
                # Later jobs (e.g. the NextJS publish workflow) download them with the same artifact name.
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ inputs.artifact-name }}
                    path: out
                    if-no-files-found: error
                    retention-days: 7
