name: "Publish AsciiDoc PDF Release"
on:
    workflow_call:
        inputs:
            adoc-file:
                description: "Path to the AsciiDoc file, relative to the repository root."
                required: true
                type: string
            tag:
                description: "The tag to checkout. Also used as the document version (project-version attribute) and in the PDF file name."
                required: true
                type: string
            asciidoctor-image:
                description: "Docker image providing asciidoctor-pdf. Pin a tested tag or digest."
                required: false
                type: string
                default: "asciidoctor/docker-asciidoctor:latest"
            failure-level:
                description: "Minimum Asciidoctor log level that fails the build (INFO, WARN, ERROR, FATAL)."
                required: false
                type: string
                default: "ERROR"
            artifact-name:
                description: "Name of the workflow artifact that will hold the PDF (downloaded by later jobs)."
                required: false
                type: string
                default: "installation-guide-pdf"
        outputs:
            artifact-name:
                description: "Name of the artifact containing the generated PDF."
                value: ${{ inputs.artifact-name }}
            pdf-name:
                description: "File name of the generated PDF."
                value: ${{ jobs.pdf.outputs.pdf-name }}
permissions:
    contents: read
jobs:
    pdf:
        name: Generate the PDF
        runs-on: ubuntu-latest
        outputs:
            pdf-name: ${{ steps.names.outputs.pdf-name }}
        steps:
            -   name: Checkout tag
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    ref: ${{ inputs.tag }}
            -   name: Compute output name
                id: names
                env:
                    ADOC_FILE: ${{ inputs.adoc-file }}
                    TAG: ${{ inputs.tag }}
                run: |
                    base="$(basename "$ADOC_FILE" .adoc)"
                    echo "pdf-name=${base}-${TAG}.pdf" >> "$GITHUB_OUTPUT"
            -   name: Build PDF
                # The tag is passed as the `project-version` attribute (shown on the title page).
                env:
                    ADOC_FILE: ${{ inputs.adoc-file }}
                    TAG: ${{ inputs.tag }}
                    IMAGE: ${{ inputs.asciidoctor-image }}
                    FAILURE_LEVEL: ${{ inputs.failure-level }}
                    PDF_NAME: ${{ steps.names.outputs.pdf-name }}
                run: |
                    docker run --rm -v "$PWD":/documents "$IMAGE" \
                      asciidoctor-pdf \
                      --failure-level="$FAILURE_LEVEL" \
                      -a project-version="$TAG" \
                      -D out \
                      -o "$PDF_NAME" \
                      "$ADOC_FILE"
                    ls -l "out/$PDF_NAME"
            -   name: Upload PDF as workflow artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ inputs.artifact-name }}
                    path: out/${{ steps.names.outputs.pdf-name }}
                    if-no-files-found: error
                    retention-days: 7
