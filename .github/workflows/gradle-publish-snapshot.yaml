name: "Publish Snapshot to Maven Repository"
# Deploys a Gradle -SNAPSHOT to the e-CODEX JFrog Artifactory (scm.ecodex.eu) with the JFrog CLI.
# Runs on every push to develop. Does nothing when the project version is not a -SNAPSHOT (e.g. while a release is
# being prepared), so a release version is never overwritten by a develop build.
#
# Same supply chain as gradle-publish-release.yaml (see there for the details):
#   - GitHub OIDC login, no secrets;
#   - 'jf gradle artifactoryPublish' deploys the publications and records them in the build-info
#     '<repository>-snapshot' (separate name so snapshots and releases have their own build history);
#   - the CycloneDX SBOM is deployed next to the distribution zip;
#   - the zip gets a provenance and an SBOM attestation (GitHub) that setup-jfrog-cli turns into JFrog evidence;
#   - the setup-jfrog-cli post step publishes the build-info and the evidence at the end of the job.
on:
    workflow_call:
        inputs:
            java-version:
                description: "Java version to use for the build."
                required: true
                type: number
                default: 21
            gradle-parameters:
                description: "Extra parameters to pass to Gradle"
                required: false
                type: string
                default: ""
            maven-repo-id:
                description: "Deprecated and ignored: the JFrog CLI deploys to 'deploy-repo'"
                required: false
                type: string
                default: ""
            deploy-repo:
                description: "Artifactory repository to deploy the snapshot to"
                required: false
                type: string
                default: "libs-snapshot"
            distribution-path:
                description: "Local path (glob) of the main artifact (distribution zip) to attest"
                required: true
                type: string
            sbom-path:
                description: "Path of the CycloneDX JSON SBOM generated by the 'cyclonedxBom' task"
                required: false
                type: string
                default: "build/reports/cyclonedx/bom.json"
permissions:
    contents: read
jobs:
    publish:
        name: Publish Snapshot to Maven Repository
        permissions:
            contents: write     # dependency submission to GitHub
            id-token: write     # GitHub OIDC token, used for the JFrog login and for signing the attestations
            attestations: write # store the attestations in GitHub
        runs-on: ubuntu-latest
        env:
            # Build-info name in Artifactory, separate from the release builds
            JFROG_CLI_BUILD_NAME: ${{ github.event.repository.name }}-snapshot
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Needed by the documentation module (diagrams)
            -   name: Install Graphviz
                uses: e-CODEX/workflows/.github/actions/install-graphviz@main

            -   name: Setup Java
                uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
                with:
                    distribution: 'temurin'
                    java-version: ${{ inputs.java-version }}

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

            # Only -SNAPSHOT versions are published from develop; all following JFrog steps depend on this
            -   name: Check if version is Snapshot
                id: check-version
                run: |
                    VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
                    if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
                        echo "snapshot=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "Version $VERSION is not a SNAPSHOT, nothing to publish."
                        echo "snapshot=false" >> "$GITHUB_OUTPUT"
                    fi

            # Installs a pinned JFrog CLI and logs in with GitHub OIDC (OIDC integration 'setup-jfrog' in JFrog).
            # Its post step publishes the build-info and creates the JFrog evidence at the end of the job.
            -   name: Setup JFrog CLI
                if: ${{ steps.check-version.outputs.snapshot == 'true' }}
                uses: jfrog/setup-jfrog-cli@4c2f06da03095113100534a16d58d8a252680949 # v5.3.5
                env:
                    JF_URL: https://scm.ecodex.eu
                with:
                    version: 2.133.0
                    oidc-provider-name: setup-jfrog

            # Dependency graph for Dependabot alerts / GitHub Advanced Security
            -   name: Submit Dependency Snapshot to GitHub Advanced Security
                uses: mikepenz/gradle-dependency-submission@v1

            # See gradle-publish-release.yaml: deploy to 'deploy-repo' with the wrapper, POMs but no Ivy
            # descriptors, no configuration cache (not supported by the JFrog Gradle extractor init script).
            -   name: Publish Snapshot
                if: ${{ steps.check-version.outputs.snapshot == 'true' }}
                env:
                    DEPLOY_REPO: ${{ inputs.deploy-repo }}
                    GRADLE_PARAMETERS: ${{ inputs.gradle-parameters }}
                run: |
                    jf gradle-config --repo-deploy="${DEPLOY_REPO}" --use-wrapper --deploy-ivy-desc=false
                    jf gradle clean cyclonedxBom artifactoryPublish --no-configuration-cache ${GRADLE_PARAMETERS}

            # Find the deployed zip in Artifactory by sha256 (its real local-repository path is the attestation
            # subject) and upload the SBOM next to it; 'jf rt upload' also adds the SBOM to the build-info.
            -   name: Deploy the SBOM next to the distribution
                if: ${{ steps.check-version.outputs.snapshot == 'true' }}
                id: distribution
                env:
                    DISTRIBUTION: ${{ inputs.distribution-path }}
                    SBOM_PATH: ${{ inputs.sbom-path }}
                run: |
                    zip=$(ls ${DISTRIBUTION})
                    sha=$(sha256sum "${zip}" | cut -d' ' -f1)
                    target=$(jf rt curl -s -XPOST /api/search/aql -H "Content-Type: text/plain" \
                      -d "items.find({\"sha256\":\"${sha}\"}).include(\"repo\",\"path\",\"name\")" \
                      | jq -r '.results[0] // error("distribution not found in Artifactory") | "\(.repo)/\(.path)/\(.name)"')
                    jf rt upload "${SBOM_PATH}" "${target%.zip}-cyclonedx.json" --flat
                    echo "subject-name=${target}" >> "${GITHUB_OUTPUT}"
                    echo "subject-digest=sha256:${sha}" >> "${GITHUB_OUTPUT}"

            # SLSA build provenance: which workflow, commit and runner produced the zip
            -   name: Attest the distribution provenance
                if: ${{ steps.check-version.outputs.snapshot == 'true' }}
                uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
                with:
                    subject-name: ${{ steps.distribution.outputs.subject-name }}
                    subject-digest: ${{ steps.distribution.outputs.subject-digest }}

            # Signed statement that the SBOM describes this zip
            -   name: Attest the distribution SBOM
                if: ${{ steps.check-version.outputs.snapshot == 'true' }}
                uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
                with:
                    subject-name: ${{ steps.distribution.outputs.subject-name }}
                    subject-digest: ${{ steps.distribution.outputs.subject-digest }}
                    sbom-path: ${{ inputs.sbom-path }}
